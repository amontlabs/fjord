name: Release

# Push a tag like v0.2.0 to build a universal Fjord.app and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Created on the current commit if it doesn't exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # Bounded: a test that hangs can't hold the runner (the slowest full run takes a few minutes).
      - name: Test
        timeout-minutes: 20
        run: ./scripts/test.sh

      # One certificate for every release: macOS keeps Accessibility access across updates, and the in-app
      # updater only installs a release signed by the same certificate as the running app.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No SIGNING_CERT_P12 secret: signing ad hoc, so updating loses Accessibility access"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=${{ vars.SIGN_IDENTITY || 'Fjord Dev' }}" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          UNIVERSAL=1 ./scripts/build-app.sh
          codesign -dr - "build/Fjord.app"
          # With a certificate, the updater pins it: a release that slipped back to ad hoc wouldn't install.
          if [ -n "${SIGN_IDENTITY:-}" ] && ! codesign -dr - "build/Fjord.app" 2>&1 | grep -q "certificate leaf"; then
            echo "::error::Release isn't signed with $SIGN_IDENTITY"
            exit 1
          fi

      - name: Package
        run: |
          ditto -c -k --keepParent "build/Fjord.app" "Fjord-$VERSION.zip"
          shasum -a 256 "Fjord-$VERSION.zip" | tee "Fjord-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ### Install
          1. Download `Fjord-*.zip`, unzip, and move **Fjord.app** to `/Applications`.
          2. The app is not notarized yet, so clear the download quarantine once:
             ```
             xattr -dr com.apple.quarantine "/Applications/Fjord.app"
             ```
          3. Open it and pick your tools. Triage uses your `gh` login (`gh auth login`), or a token you paste.

          Already installed Fjord? It offers later releases itself: click the arrow on the bar, then restart.

          Requires macOS 14 or later. Universal (Apple Silicon + Intel).
          NOTES
          gh release create "$TAG" "Fjord-$VERSION.zip" "Fjord-$VERSION.zip.sha256" \
            --title "Fjord $VERSION" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
